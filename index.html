<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messenger</title>
<style>
  :root { --bg:#fff; --bar:#fff; --text:#050505; --muted:#65676b; --pill:#f0f2f5; --blue:#0084ff; --them:#e4e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#18191a; --bar:#242526; --text:#e4e6eb; --muted:#b0b3b8; --pill:#3a3b3c; --blue:#2d88ff; --them:#3a3b3c; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .screen { display:none; height:100%; flex-direction:column; }
  .screen.on { display:flex; }
  button { border:0; background:none; color:inherit; font:inherit; cursor:pointer; }
  input { font:inherit; color:var(--text); }
  .av { border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0; }
  .top { display:flex; align-items:center; gap:12px; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px)); background:var(--bar); }
  .top h1 { margin:0; font-size:26px; flex:1; }
  .top .name { font-weight:600; font-size:17px; flex:1; }
  .ib { width:38px; height:38px; border-radius:50%; background:var(--pill); display:flex; align-items:center; justify-content:center; }
  .ib svg { width:20px; height:20px; fill:var(--text); }
  .search { display:flex; gap:8px; padding:8px 14px 12px; background:var(--bar); }
  .search input { flex:1; background:var(--pill); border:0; border-radius:20px; padding:10px 16px; font-size:16px; outline:none; }
  .search button { width:40px; height:40px; border-radius:50%; background:var(--blue); display:flex; align-items:center; justify-content:center; }
  .search svg { width:20px; height:20px; fill:#fff; }
  .err { color:#e41e3f; font-size:14px; padding:0 16px; }
  #list { flex:1; overflow-y:auto; }
  .c { display:flex; align-items:center; gap:12px; padding:10px 14px; }
  .c:active { background:var(--pill); }
  .c .mid { flex:1; min-width:0; }
  .c .nm { font-weight:600; font-size:16px; }
  .c .pv { color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { padding:40px 24px; color:var(--muted); text-align:center; }
  #msgs { flex:1; overflow-y:auto; padding:12px 10px; display:flex; flex-direction:column; gap:2px; }
  .intro { display:flex; flex-direction:column; align-items:center; gap:4px; padding:16px 0 20px; }
  .in { font-size:20px; font-weight:700; margin-top:8px; }
  .is { color:var(--muted); font-size:14px; }
  .acts { display:flex; gap:28px; margin-top:12px; }
  .act { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:13px; }
  .act span { width:44px; height:44px; border-radius:50%; background:var(--pill); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .tm { align-self:center; color:var(--muted); font-size:12px; margin:10px 0 6px; }
  .m { max-width:75%; padding:8px 12px; border-radius:18px; background:var(--them); word-wrap:break-word; font-size:16px; line-height:1.3; align-self:flex-start; }
  .m.me { align-self:flex-end; background:var(--blue); color:#fff; }
  .m.big { font-size:34px; background:none; padding:0 4px; }
  .m.pic { padding:3px; }
  .m img { max-width:100%; max-height:320px; border-radius:15px; display:block; }
  .m.gap { margin-top:8px; }
  #emo { display:none; flex-wrap:wrap; gap:2px; padding:8px 10px; background:var(--bar); border-top:1px solid var(--pill); }
  #emo button { font-size:26px; width:44px; height:44px; }
  .comp { display:flex; align-items:center; gap:6px; padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px)); background:var(--bar); }
  .comp input { flex:1; min-width:0; background:var(--pill); border:0; border-radius:20px; padding:10px 14px; font-size:16px; outline:none; }
  .comp button { width:38px; height:38px; font-size:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .comp .cam { background:var(--blue); border-radius:50%; font-size:18px; }
  .comp svg { width:26px; height:26px; fill:var(--blue); }
  #blk { display:none; text-align:center; padding:14px; color:var(--muted); background:var(--bar); padding-bottom:calc(14px + env(safe-area-inset-bottom,0px)); }
  #pm { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); align-items:center; justify-content:center; z-index:9; }
  #pm .card { background:var(--bar); border-radius:20px; padding:28px 36px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .pad { margin:auto 0; padding:24px; display:flex; flex-direction:column; gap:12px; }
  .logo { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#00b2ff,#006aff); margin:0 auto 4px; display:flex; align-items:center; justify-content:center; font-size:34px; }
  .pad h1 { margin:0; text-align:center; font-size:24px; }
  .pad input { background:var(--pill); border:0; border-radius:12px; padding:14px 16px; font-size:16px; outline:none; width:100%; }
  .pad .go { background:var(--blue); color:#fff; font-weight:600; padding:14px; border-radius:24px; font-size:17px; }
  .pad .sw { color:var(--blue); padding:6px; font-weight:600; }
</style>
</head>
<body>

<div id="auth" class="screen on">
  <div class="pad">
    <div class="logo">&#128172;</div>
    <h1 id="atitle">Account banao</h1>
    <input id="u" placeholder="Username (a-z, 0-9, _)" autocapitalize="none" autocomplete="username" maxlength="15">
    <input id="p" type="password" placeholder="Password (kam se kam 6 akshar)" autocomplete="current-password">
    <div class="err" id="aerr"></div>
    <button class="go" id="abtn">Account banao</button>
    <button class="sw" id="aswitch">Pehle se account hai? Login karo</button>
  </div>
</div>

<div id="home" class="screen">
  <div class="top"><h1>Chats</h1><span id="meav"></span></div>
  <div class="search">
    <input id="s" placeholder="Username dhoondo" autocapitalize="none">
    <button id="sbtn" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
  <div class="err" id="serr"></div>
  <div id="list"></div>
</div>

<div id="chat" class="screen">
  <div class="top">
    <button class="ib" id="back" aria-label="Peeche"><svg viewBox="0 0 24 24"><path d="M20 11H7.800l5.600-5.600L12 4l-8 8 8 8 1.400-1.400L7.800 13H20z"/></svg></button>
    <span id="peerav"></span><span class="name" id="peer"></span>
  </div>
  <div id="msgs"></div>
  <div id="emo"></div>
  <div id="blk">Aapne is user ko block kiya hai. Upar <b>Unblock</b> dabao.</div>
  <form class="comp" id="sendf">
    <button type="button" class="cam" id="cam" aria-label="Camera">&#128247;</button>
    <input id="i" placeholder="Message likho..." autocomplete="off" maxlength="500">
    <button type="button" id="emb" aria-label="Emoji">&#128522;</button>
    <button type="button" id="gal" aria-label="Photo">&#128444;&#65039;</button>
    <button type="submit" id="sb"></button>
  </form>
  <input type="file" id="fc" accept="image/*" capture="environment" hidden>
  <input type="file" id="fg" accept="image/*" hidden>
</div>

<div id="pm"><div class="card" id="pcard"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAHw1-w-tCQizzko4PomUMxGMXE44xDgVw",
  authDomain: "my-chat-13ad2.firebaseapp.com",
  databaseURL: "https://my-chat-13ad2-default-rtdb.firebaseio.com",
  projectId: "my-chat-13ad2",
  appId: "1:243494627510:web:1a008c5500335f40b15e17"
};

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); };
const DOM = '@chatapp.local';
const SEND = '<svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>';
const EMOJIS = ['😀','😂','😍','😘','😎','🥰','😭','😡','👍','🙏','🔥','💯','❤️','🎉','😅','🤔','😴','🥺','😜','🤝','👏','💪','🎮','😈'];
let signup = true, me = null, myName = '', peerId = null, peerName = '', msgRef = null, listRef = null;
let blkRef = null, blockedByMe = false, blkBtn = null, joinedTxt = '';

function av(n, s) {
  let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360;
  const d = document.createElement('div'); d.className = 'av';
  d.style.cssText = 'width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(s * 0.42) + 'px;background:hsl(' + h + ' 55% 45%)';
  d.textContent = n[0].toUpperCase();
  return d;
}
const hm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function fmt(t) {
  const d = new Date(t);
  return d.toDateString() === new Date().toDateString() ? hm(t) : d.toLocaleDateString([], { day: 'numeric', month: 'short' });
}

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.database();

$('aswitch').onclick = () => {
  signup = !signup;
  $('atitle').textContent = signup ? 'Account banao' : 'Login karo';
  $('abtn').textContent = signup ? 'Account banao' : 'Login';
  $('aswitch').textContent = signup ? 'Pehle se account hai? Login karo' : 'Naya account banao';
  $('aerr').textContent = '';
};

$('abtn').onclick = async () => {
  const u = $('u').value.trim().toLowerCase(), p = $('p').value;
  $('aerr').textContent = '';
  if (!/^[a-z0-9_]{3,15}$/.test(u)) return $('aerr').textContent = 'Username 3-15 akshar: a-z, 0-9 ya _';
  if (p.length < 6) return $('aerr').textContent = 'Password kam se kam 6 akshar ka rakho';
  try {
    if (signup) {
      const c = await auth.createUserWithEmailAndPassword(u + DOM, p);
      await db.ref('users/' + c.user.uid).set({ username: u, joined: firebase.database.ServerValue.TIMESTAMP });
      await db.ref('usernames/' + u).set(c.user.uid);
    } else {
      await auth.signInWithEmailAndPassword(u + DOM, p);
    }
  } catch (e) {
    const m = {
      'auth/email-already-in-use': 'Ye username le liya gaya hai, dusra chuno',
      'auth/invalid-credential': 'Username ya password galat hai',
      'auth/wrong-password': 'Password galat hai',
      'auth/user-not-found': 'Is username ka account nahi hai',
      'auth/operation-not-allowed': 'Firebase me Email/Password sign-in ON karo'
    };
    $('aerr').textContent = m[e.code] || e.message;
  }
};

auth.onAuthStateChanged(user => {
  if (listRef) { listRef.off(); listRef = null; }
  if (!user) { me = null; show('auth'); return; }
  me = user.uid;
  myName = user.email.replace(DOM, '');
  const mine = av(myName, 38); mine.style.cursor = 'pointer';
  mine.onclick = () => { if (confirm('Logout karna hai?')) auth.signOut(); };
  $('meav').textContent = ''; $('meav').appendChild(mine);
  show('home');
  listRef = db.ref('userChats/' + me);
  listRef.on('value', snap => {
    const items = [];
    snap.forEach(ch => { items.push({ id: ch.key, ...ch.val() }); });
    items.sort((a, b) => b.time - a.time);
    const box = $('list'); box.textContent = '';
    if (!items.length) {
      const d = document.createElement('div'); d.className = 'empty';
      d.textContent = 'Abhi koi chat nahi. Upar username dhoondo aur baat shuru karo.';
      box.appendChild(d); return;
    }
    items.forEach(c => {
      const row = document.createElement('div'); row.className = 'c';
      const mid = document.createElement('div'); mid.className = 'mid';
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = c.username;
      const pv = document.createElement('div'); pv.className = 'pv';
      pv.textContent = (c.from === me ? 'Aap: ' : '') + (c.last || '') + '  ·  ' + fmt(c.time);
      mid.append(nm, pv);
      row.append(av(c.username, 52), mid);
      row.onclick = () => openChat(c.id, c.username);
      box.appendChild(row);
    });
  });
});

$('sbtn').onclick = async () => {
  const n = $('s').value.trim().toLowerCase().replace(/^@/, '');
  $('serr').textContent = '';
  if (!n) return;
  if (n === myName) return $('serr').textContent = 'Ye aap khud ho';
  try {
    const snap = await db.ref('usernames/' + n).get();
    if (!snap.exists()) return $('serr').textContent = 'Ye username nahi mila';
    $('s').value = '';
    openChat(snap.val(), n);
  } catch (e) { $('serr').textContent = e.message; }
};

const chatId = () => [me, peerId].sort().join('_');
const isEmoji = t => /^\p{Extended_Pictographic}{1,3}$/u.test(t || '');

function mkAct(icon, label) {
  const b = document.createElement('button'); b.className = 'act'; b.type = 'button';
  const s = document.createElement('span'); s.textContent = icon;
  const l = document.createElement('div'); l.textContent = label;
  b.append(s, l);
  return { b, l };
}

function buildIntro() {
  const d = document.createElement('div'); d.className = 'intro';
  const n = document.createElement('div'); n.className = 'in'; n.textContent = peerName;
  const s = document.createElement('div'); s.className = 'is'; s.id = 'joined'; s.textContent = '@' + peerName;
  const row = document.createElement('div'); row.className = 'acts';
  const pr = mkAct('\u{1F464}', 'Profile');
  pr.b.onclick = () => {
    const c = $('pcard'); c.textContent = '';
    const a = av(peerName, 96), t1 = document.createElement('div'), t2 = document.createElement('div');
    t1.className = 'in'; t1.textContent = peerName; t2.className = 'is'; t2.textContent = $('joined').textContent;
    c.append(a, t1, t2); $('pm').style.display = 'flex';
  };
  const bk = mkAct('\u{1F6AB}', 'Block'); blkBtn = bk.l;
  bk.b.onclick = () => {
    const r = db.ref('blocks/' + me + '/' + peerId);
    if (blockedByMe) r.remove();
    else if (confirm(peerName + ' ko block karein?')) r.set(true);
  };
  row.append(pr.b, bk.b);
  d.append(av(peerName, 96), n, s, row);
  return d;
}
$('pm').onclick = () => { $('pm').style.display = 'none'; };

function openChat(uid, name) {
  peerId = uid; peerName = name; blockedByMe = false;
  $('peer').textContent = name;
  $('peerav').textContent = ''; $('peerav').appendChild(av(name, 38));
  $('msgs').textContent = ''; $('msgs').appendChild(buildIntro());
  $('i').value = ''; $('emo').style.display = 'none'; upd();
  show('chat');
  db.ref('users/' + uid + '/joined').get().then(s => {
    if (s.exists() && peerId === uid) $('joined').textContent = '@' + name + ' · Joined ' + new Date(s.val()).toLocaleDateString([], { month: 'short', year: 'numeric' });
  }).catch(() => {});
  if (blkRef) blkRef.off();
  blkRef = db.ref('blocks/' + me + '/' + uid);
  blkRef.on('value', s => {
    blockedByMe = s.exists();
    $('sendf').style.display = blockedByMe ? 'none' : 'flex';
    $('blk').style.display = blockedByMe ? 'block' : 'none';
    if (blkBtn) blkBtn.textContent = blockedByMe ? 'Unblock' : 'Block';
  });
  if (msgRef) msgRef.off();
  let lastFrom = null, lastT = 0;
  msgRef = db.ref('chats/' + chatId()).limitToLast(100);
  msgRef.on('child_added', snap => {
    const d = snap.val(), box = $('msgs');
    if (d.time - lastT > 600000) {
      const t = document.createElement('div'); t.className = 'tm';
      t.textContent = fmt(d.time) + ' ' + hm(d.time);
      box.appendChild(t); lastFrom = null;
    }
    const el = document.createElement('div');
    el.className = 'm' + (d.from === me ? ' me' : '') + (d.img ? ' pic' : '') + (isEmoji(d.text) ? ' big' : '') + (lastFrom && lastFrom !== d.from ? ' gap' : '');
    if (d.img) { const im = document.createElement('img'); im.src = d.img; el.appendChild(im); }
    else el.textContent = d.text;
    box.appendChild(el);
    lastFrom = d.from; lastT = d.time;
    box.scrollTop = box.scrollHeight;
  });
}

$('back').onclick = () => {
  if (msgRef) { msgRef.off(); msgRef = null; }
  if (blkRef) { blkRef.off(); blkRef = null; }
  show('home');
};

function upd() { $('sb').innerHTML = $('i').value.trim() ? SEND : '\u{1F44D}'; }
$('i').addEventListener('input', upd); upd();

EMOJIS.forEach(e => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
  b.onclick = () => { $('i').value += e; upd(); };
  $('emo').appendChild(b);
});
$('emb').onclick = () => { const e = $('emo'); e.style.display = e.style.display === 'flex' ? 'none' : 'flex'; };

async function send(text, img) {
  try {
    const b = await db.ref('blocks/' + peerId + '/' + me).get();
    if (b.exists()) return alert('Is user ne aapko block kiya hai.');
  } catch (e) {}
  const time = firebase.database.ServerValue.TIMESTAMP;
  const key = db.ref('chats/' + chatId()).push().key;
  const last = img ? '\u{1F4F7} Photo' : text.slice(0, 40);
  const up = {};
  up['chats/' + chatId() + '/' + key] = img ? { from: me, img, time } : { from: me, text, time };
  up['userChats/' + me + '/' + peerId] = { username: peerName, last, from: me, time };
  up['userChats/' + peerId + '/' + me] = { username: myName, last, from: me, time };
  db.ref().update(up).catch(x => alert('Send nahi hua: ' + x.message));
}

$('sendf').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('i').value.trim() || '\u{1F44D}';
  $('i').value = ''; upd();
  send(text);
});

function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, 800 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.6));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
async function onPic(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { send('', await shrink(f)); } catch (x) { alert('Photo nahi chuni ja saki'); }
}
$('cam').onclick = () => $('fc').click();
$('gal').onclick = () => $('fg').click();
$('fc').onchange = onPic; $('fg').onchange = onPic;
</script>
</body>
</html>
